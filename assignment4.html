<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damped Spring Calculator</title>
<!-- Chart.js plotting library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; background: #fff; color: #222; }
  .equation { background: #f4f4f4; padding: 10px; border-left: 4px solid #555; font-size: 1.1em; }
  label { display: inline-block; width: 230px; margin: 6px 0; }
  input { width: 100px; padding: 4px; }
  button { margin-top: 10px; padding: 8px 18px; font-size: 1em; }
  #output { margin-top: 15px; }
  #chartBox { height: 400px; margin-top: 15px; }
</style>
</head>
<body>

<p><a href="assignments.html">&larr; Back to My Assignments</a></p>
<h1>Damped Spring Calculator</h1>
<p>
A weight bouncing on a spring slowly stops because of friction. This calculator finds the
position of the weight (x) at each time (t) and plots it.
</p>

<div class="equation">
  <strong>Equation:</strong> &nbsp; x(t) = A &middot; e<sup>&minus;(b / 2m)t</sup> &middot; cos(&omega;t)
  &nbsp;&nbsp; where &nbsp; &omega; = &radic;( k/m &minus; (b / 2m)<sup>2</sup> )
</div>

<h3>Inputs</h3>
<label for="A">Starting stretch A (m):</label> <input id="A" type="number" value="1"><br>
<label for="m">Mass m (kg):</label> <input id="m" type="number" value="1"><br>
<label for="k">Spring stiffness k (N/m):</label> <input id="k" type="number" value="10"><br>
<label for="b">Friction b (kg/s):</label> <input id="b" type="number" value="0.5"><br>
<label for="tStart">Start time (s):</label> <input id="tStart" type="number" value="0"><br>
<label for="tEnd">End time (s):</label> <input id="tEnd" type="number" value="20"><br>

<button onclick="calculate()">Calculate &amp; Plot</button>

<div id="output"></div>
<div id="chartBox"><canvas id="myChart"></canvas></div>

<script>
var myChart = null;   // holds the chart so we can redraw it

function calculate() {
  // 1. Read the values the user typed in
  var A = parseFloat(document.getElementById("A").value);
  var m = parseFloat(document.getElementById("m").value);
  var k = parseFloat(document.getElementById("k").value);
  var b = parseFloat(document.getElementById("b").value);
  var tStart = parseFloat(document.getElementById("tStart").value);
  var tEnd = parseFloat(document.getElementById("tEnd").value);
  var output = document.getElementById("output");

  // 2. Check the inputs
  if (m <= 0 || k <= 0 || b < 0 || tEnd <= tStart) {
    output.innerHTML = "<p style='color:red'>Please use mass &gt; 0, stiffness &gt; 0, friction &ge; 0, and an end time bigger than the start time.</p>";
    return;
  }

  // 3. Work out the decay rate and the bounce speed (omega)
  var decay = b / (2 * m);
  var omegaSquared = k / m - decay * decay;
  if (omegaSquared <= 0) {
    output.innerHTML = "<p style='color:red'>The friction is too high, so the spring will not bounce. Try a smaller friction value.</p>";
    return;
  }
  var omega = Math.sqrt(omegaSquared);
  var period = 2 * Math.PI / omega;   // time for one full bounce

  // 4. Calculate x at many time values for the plot
  var xValues = [];
  var step = (tEnd - tStart) / 400;
  for (var t = tStart; t <= tEnd + step / 2; t += step) {
    var x = A * Math.exp(-decay * t) * Math.cos(omega * t);
    xValues.push({ x: t, y: x });
  }

  // 5. Find the solutions: times when x = 0 (the weight passes the middle).
  //    cos(omega * t) = 0 when omega * t = pi/2, 3pi/2, 5pi/2, ...
  var solutions = [];
  for (var n = 0; n < 1000; n++) {
    var tZero = (Math.PI / 2 + n * Math.PI) / omega;
    if (tZero > tEnd) break;
    if (tZero >= tStart) solutions.push(tZero.toFixed(3));
  }

  // 6. Show the results
  output.innerHTML =
    "<h3>Results</h3>" +
    "<p>Bounce speed &omega; = " + omega.toFixed(4) + " rad/s</p>" +
    "<p>Time for one bounce = " + period.toFixed(4) + " s</p>" +
    "<p>Position at end time: x(" + tEnd + ") = " + (A * Math.exp(-decay * tEnd) * Math.cos(omega * tEnd)).toFixed(4) + " m</p>" +
    "<p><strong>Solutions (x = 0) in the range:</strong> " +
    (solutions.length ? "t = " + solutions.join(" s, t = ") + " s" : "none in this range") + "</p>";

  // 7. Draw the plot (remove the old one first)
  if (myChart) myChart.destroy();
  myChart = new Chart(document.getElementById("myChart"), {
    type: "line",
    data: {
      datasets: [{
        label: "Position x(t)",
        data: xValues,
        borderColor: "blue",
        borderWidth: 2,
        pointRadius: 0
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: { title: { display: true, text: "Damped Spring: Position vs. Time" } },
      scales: {
        x: { type: "linear", title: { display: true, text: "Time t (s)" } },
        y: { title: { display: true, text: "Position x (m)" } }
      }
    }
  });
}

// Run once when the page loads so the example numbers show right away
window.onload = calculate;
</script>

</body>
</html>
