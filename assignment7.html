<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment 7 - Fruit Matching Game</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff8ec;
    color: #333;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 { margin: 0 0 6px; color: #2e7d32; }
  p.instructions { margin: 0 0 16px; }

  #score { font-size: 18px; font-weight: bold; margin-bottom: 12px; }

  #fruits {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    min-height: 110px;
    padding: 12px;
    margin: 0 auto 24px;
    max-width: 760px;
    border: 2px dashed #c8b89a;
    border-radius: 12px;
    background: #fff;
  }

  .fruit {
    width: 90px;
    height: 90px;
    cursor: grab;
    transition: transform 0.15s;
  }
  .fruit:hover { transform: scale(1.1); }
  .fruit.dragging { opacity: 0.4; }

  #baskets {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 760px;
    margin: 0 auto;
  }

  .basket {
    width: 110px;
    height: 140px;
    border: 3px dashed #8d6e63;
    border-radius: 12px;
    background: #f3e5d0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    box-sizing: border-box;
  }
  .basket .name { font-weight: bold; font-size: 17px; }
  .basket .slot { height: 90px; display: flex; align-items: center; }
  .basket .slot img { width: 80px; height: 80px; }
  .basket.over { background: #fff3b0; border-color: #f9a825; }
  .basket.matched { background: #c8e6c9; border: 3px solid #2e7d32; }
  .basket.wrong { background: #ffcdd2; border-color: #c62828; animation: shake 0.4s; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  #message {
    margin-top: 24px;
    min-height: 30px;
    font-size: 22px;
    font-weight: bold;
  }
  #message.good { color: #2e7d32; }
  #message.bad { color: #c62828; }

  #playAgain {
    display: none;
    margin-top: 12px;
    font-size: 16px;
    padding: 10px 22px;
    border: none;
    border-radius: 6px;
    background: #2e7d32;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Fruit Matching Game</h1>
<p class="instructions">Drag each fruit into the basket with its name. Match all 6 to win!</p>

<div id="score">Matched: 0 / 6</div>

<div id="fruits"></div>
<div id="baskets"></div>

<div id="message"></div>
<button id="playAgain">Play Again</button>

<script>
  // ----- Fruit pictures (SVG images drawn with code) -----
  var FRUITS = [
    { id: "apple", name: "Apple", svg:
      '<circle cx="50" cy="58" r="32" fill="#d32f2f"/>' +
      '<rect x="48" y="16" width="5" height="16" rx="2" fill="#5d4037"/>' +
      '<ellipse cx="64" cy="22" rx="12" ry="6" fill="#43a047" transform="rotate(-25 64 22)"/>' +
      '<ellipse cx="38" cy="46" rx="6" ry="10" fill="#ef9a9a" opacity="0.7"/>' },
    { id: "banana", name: "Banana", svg:
      '<path d="M18 30 Q30 82 84 72 Q88 66 82 64 Q40 66 30 26 Z" fill="#fdd835" stroke="#c6a700" stroke-width="2"/>' +
      '<rect x="14" y="22" width="8" height="10" rx="2" fill="#6d4c41"/>' },
    { id: "grapes", name: "Grapes", svg:
      '<rect x="48" y="10" width="4" height="14" fill="#5d4037"/>' +
      '<ellipse cx="64" cy="18" rx="12" ry="6" fill="#43a047"/>' +
      '<circle cx="36" cy="34" r="10" fill="#7b1fa2"/><circle cx="56" cy="34" r="10" fill="#8e24aa"/><circle cx="74" cy="36" r="9" fill="#7b1fa2"/>' +
      '<circle cx="44" cy="52" r="10" fill="#8e24aa"/><circle cx="64" cy="52" r="10" fill="#7b1fa2"/>' +
      '<circle cx="52" cy="70" r="10" fill="#8e24aa"/><circle cx="36" cy="68" r="8" fill="#7b1fa2"/>' +
      '<circle cx="52" cy="88" r="8" fill="#7b1fa2"/>' },
    { id: "orange", name: "Orange", svg:
      '<circle cx="50" cy="55" r="33" fill="#fb8c00"/>' +
      '<circle cx="40" cy="45" r="2" fill="#ef6c00"/><circle cx="58" cy="62" r="2" fill="#ef6c00"/>' +
      '<circle cx="62" cy="42" r="2" fill="#ef6c00"/><circle cx="42" cy="68" r="2" fill="#ef6c00"/>' +
      '<ellipse cx="58" cy="20" rx="10" ry="5" fill="#43a047"/>' },
    { id: "strawberry", name: "Strawberry", svg:
      '<path d="M20 34 Q50 24 80 34 Q78 70 50 92 Q22 70 20 34 Z" fill="#e53935"/>' +
      '<path d="M30 30 L40 18 L50 28 L60 18 L70 30 Z" fill="#2e7d32"/>' +
      '<circle cx="38" cy="46" r="2" fill="#ffeb3b"/><circle cx="52" cy="44" r="2" fill="#ffeb3b"/><circle cx="64" cy="48" r="2" fill="#ffeb3b"/>' +
      '<circle cx="44" cy="60" r="2" fill="#ffeb3b"/><circle cx="58" cy="62" r="2" fill="#ffeb3b"/><circle cx="50" cy="76" r="2" fill="#ffeb3b"/>' },
    { id: "cherries", name: "Cherries", svg:
      '<path d="M34 66 Q40 30 62 14" stroke="#5d4037" stroke-width="3" fill="none"/>' +
      '<path d="M68 70 Q66 36 62 14" stroke="#5d4037" stroke-width="3" fill="none"/>' +
      '<ellipse cx="70" cy="16" rx="10" ry="5" fill="#43a047"/>' +
      '<circle cx="32" cy="74" r="16" fill="#b71c1c"/><circle cx="68" cy="78" r="16" fill="#c62828"/>' +
      '<circle cx="26" cy="68" r="4" fill="#ef9a9a" opacity="0.7"/><circle cx="62" cy="72" r="4" fill="#ef9a9a" opacity="0.7"/>' }
  ];

  var matched = 0;

  function makeFruitImage(fruit) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">' + fruit.svg + '</svg>';
    var img = document.createElement("img");
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    img.alt = fruit.name;
    img.title = fruit.name;
    img.id = "fruit-" + fruit.id;
    img.className = "fruit";
    img.draggable = true;
    img.dataset.fruit = fruit.id;

    img.addEventListener("dragstart", function (e) {
      e.dataTransfer.setData("text/plain", img.id);
      e.dataTransfer.effectAllowed = "move";
      img.classList.add("dragging");
    });
    img.addEventListener("dragend", function () {
      img.classList.remove("dragging");
    });
    return img;
  }

  function makeBasket(fruit) {
    var basket = document.createElement("div");
    basket.className = "basket";
    basket.dataset.fruit = fruit.id;
    basket.innerHTML = '<div class="slot"></div><div class="name">' + fruit.name + '</div>';

    basket.addEventListener("dragover", function (e) {
      if (basket.classList.contains("matched")) return;
      e.preventDefault();                // allow a drop here
      e.dataTransfer.dropEffect = "move";
    });
    basket.addEventListener("dragenter", function (e) {
      if (basket.classList.contains("matched")) return;
      e.preventDefault();
      basket.classList.add("over");
    });
    basket.addEventListener("dragleave", function () {
      basket.classList.remove("over");
    });

    // ----- The triggered event when a fruit is dropped -----
    basket.addEventListener("drop", function (e) {
      e.preventDefault();
      basket.classList.remove("over");

      var img = document.getElementById(e.dataTransfer.getData("text/plain"));
      if (!img) return;

      if (img.dataset.fruit === basket.dataset.fruit) {
        // Correct match: lock the fruit into the basket
        basket.querySelector(".slot").appendChild(img);
        img.draggable = false;
        img.classList.remove("dragging");
        img.style.cursor = "default";
        basket.classList.add("matched");
        matched++;
        document.getElementById("score").textContent = "Matched: " + matched + " / " + FRUITS.length;

        if (matched === FRUITS.length) {
          showMessage("You matched all " + FRUITS.length + " fruits! Great job!", "good");
          document.getElementById("playAgain").style.display = "inline-block";
        } else {
          showMessage("Match! That's the " + img.alt + ".", "good");
        }
      } else {
        // Wrong match: fruit stays where it was
        showMessage("Oops! That's not " + basket.querySelector(".name").textContent + ". Try again.", "bad");
        basket.classList.remove("wrong");
        void basket.offsetWidth;          // restart the shake animation
        basket.classList.add("wrong");
        setTimeout(function () { basket.classList.remove("wrong"); }, 600);
      }
    });
    return basket;
  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showMessage(text, type) {
    var m = document.getElementById("message");
    m.textContent = text;
    m.className = type || "";
  }

  function startGame() {
    matched = 0;
    document.getElementById("score").textContent = "Matched: 0 / " + FRUITS.length;
    showMessage("");
    document.getElementById("playAgain").style.display = "none";

    var fruitArea = document.getElementById("fruits");
    var basketArea = document.getElementById("baskets");
    fruitArea.innerHTML = "";
    basketArea.innerHTML = "";

    // Fruits and baskets are shuffled separately so they don't line up
    shuffle(FRUITS).forEach(function (f) { fruitArea.appendChild(makeFruitImage(f)); });
    shuffle(FRUITS).forEach(function (f) { basketArea.appendChild(makeBasket(f)); });
  }

  document.getElementById("playAgain").addEventListener("click", startGame);
  startGame();
</script>
</body>
</html>
