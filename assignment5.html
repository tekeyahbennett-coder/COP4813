<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirograph</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h1 { margin-top: 0; }
  #controls {
    display: inline-block;
    background: #fff;
    border: 1px solid #ccc;
    padding: 12px 18px;
    margin-bottom: 15px;
  }
  #values { margin: 8px 0; min-height: 1.2em; }
  button { font-size: 1em; padding: 6px 18px; cursor: pointer; }
  canvas {
    background: #fff;
    border: 1px solid #333;
    max-width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<h1>Spirograph</h1>

<div id="controls">
  <p>Each click picks random values for R, r, and O and draws a new pattern.</p>
  <label><input type="checkbox" id="changeColor" checked> Change color as it draws</label>
  <div id="values"></div>
  <button id="startBtn">Draw Spirograph</button>
</div>

<br>
<canvas id="canvas" width="600" height="600"></canvas>

<script>
var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var R, r, O;              // Spirograph values
var t;                    // current angle
var tMax;                 // angle where the pattern closes on itself
var x, y;                 // current pen position
var scale;                // shrinks/grows the drawing to fit the canvas
var hue;                  // current color (0-360)
var stepsPerFrame;
var animationId = null;

var dt = 0.05;            // how much t increases each step
var centerX = canvas.width / 2;
var centerY = canvas.height / 2;

// Random whole number from min to max (both included)
function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Greatest common divisor - used to find when the pattern repeats
function gcd(a, b) {
  while (b !== 0) {
    var temp = b;
    b = a % b;
    a = temp;
  }
  return a;
}

// Pick valid random values:
//   R from 60 to 150
//   r from 10 to R - 5   (r is always smaller than R)
//   O from 0 to r
// If r divides R too evenly the pattern only has 1 or 2 loops,
// so pick again until it has at least 3.
function pickRandomValues() {
  do {
    R = randomInt(60, 150);
    r = randomInt(10, R - 5);
  } while (r / gcd(R, r) < 3);
  O = randomInt(0, r);
}

// Spirograph equations from the assignment
function getPosition(t) {
  var px = (R + r) * Math.cos(t) - (r + O) * Math.cos(((R + r) / r) * t);
  var py = (R + r) * Math.sin(t) - (r + O) * Math.sin(((R + r) / r) * t);
  x = centerX + px * scale;
  y = centerY + py * scale;
}

// Draw one small line segment from the old pen position to the new one
function drawSegment() {
  ctx.beginPath();
  ctx.moveTo(x, y);
  t += dt;
  getPosition(t);
  ctx.lineTo(x, y);

  if (document.getElementById("changeColor").checked) {
    hue = (hue + 0.5) % 360;
    ctx.strokeStyle = "hsl(" + hue + ", 80%, 45%)";
  } else {
    ctx.strokeStyle = "#1a3d8f";
  }
  ctx.stroke();
}

// Runs once per animation frame and draws several segments each time
function animate() {
  for (var i = 0; i < stepsPerFrame; i++) {
    if (t >= tMax) {
      animationId = null;      // pattern is complete - stop drawing
      return;
    }
    drawSegment();
  }
  animationId = requestAnimationFrame(animate);
}

function startSpirograph() {
  // If a drawing is already running, stop it before starting over
  if (animationId !== null) {
    cancelAnimationFrame(animationId);
  }

  pickRandomValues();
  document.getElementById("values").textContent =
    "R = " + R + ", r = " + r + ", O = " + O;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 1.5;

  // Largest distance the pen can reach is (R + r) + (r + O); fit it in the canvas
  scale = (canvas.width / 2 - 15) / (R + 2 * r + O);

  // The pattern closes after the inner circle makes r / gcd(R, r) trips around
  tMax = 2 * Math.PI * r / gcd(R, r);

  // Keep long patterns from taking forever (finish in roughly 10 seconds)
  var totalSteps = tMax / dt;
  stepsPerFrame = Math.max(3, Math.ceil(totalSteps / 600));

  t = 0;
  hue = Math.random() * 360;
  getPosition(t);
  animationId = requestAnimationFrame(animate);
}

document.getElementById("startBtn").addEventListener("click", startSpirograph);
</script>

</body>
</html>
