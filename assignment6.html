<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 6 - JSON</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    h1 { margin-top: 0; }
    .controls { margin: 0 0 16px 0; }
    .controls label { font-weight: bold; margin-right: 8px; }
    select { font-size: 1rem; padding: 6px 8px; }
    .summary { margin-bottom: 16px; line-height: 1.5; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #1f3b5a;
      color: #fff;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { background: #2c5480; }
    tbody tr:nth-child(even) { background: #f7f9fb; }
    tfoot td { font-weight: bold; border-top: 2px solid #1f3b5a; }
    .number-one { color: #1d6b35; font-weight: bold; }
    .error { color: #a12622; font-weight: bold; }
    .note { font-size: 0.85rem; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>R&amp;B Studio Albums: Beyoncé and Chris Brown</h1>

    <div class="controls">
      <label for="dataSelect">Show data from:</label>
      <select id="dataSelect">
        <option value="beyonce.json">Beyoncé (beyonce.json)</option>
        <option value="chrisbrown.json">Chris Brown (chrisbrown.json)</option>
        <option value="both">Both artists (both files)</option>
      </select>
    </div>

    <div class="summary" id="summary">Loading data...</div>

    <div class="table-wrap">
      <table>
        <thead><tr id="headerRow"></tr></thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>

    <p class="note">Click any column heading to sort. Everything in the table is read from the external files
      <a href="beyonce.json">beyonce.json</a> and <a href="chrisbrown.json">chrisbrown.json</a>.
      Adding an album to either file updates this page with no HTML changes.</p>
  </main>

  <script>
    const FILES = ["beyonce.json", "chrisbrown.json"];

    // Columns shown in the table: key in the JSON object and heading text
    const COLUMNS = [
      { key: "artist", heading: "Artist" },
      { key: "title", heading: "Album" },
      { key: "releaseDate", heading: "Release Date" },
      { key: "label", heading: "Label" },
      { key: "billboard200Peak", heading: "Billboard 200 Peak" },
      { key: "albumGrammy", heading: "Grammy Won for Album" }
    ];

    let rows = [];            // albums currently displayed
    let showArtist = false;   // Artist column only when both files are shown
    let sortKey = null;
    let sortAscending = true;

    // Read one external JSON file and parse it into a JavaScript object
    function loadFile(fileName) {
      return fetch(fileName).then(function (response) {
        if (!response.ok) {
          throw new Error("Could not load " + fileName + " (HTTP " + response.status + ")");
        }
        return response.text();
      }).then(function (text) {
        return JSON.parse(text);
      });
    }

    function showSelection(choice) {
      const fileList = (choice === "both") ? FILES : [choice];
      document.getElementById("summary").textContent = "Loading data...";

      Promise.all(fileList.map(loadFile))
        .then(function (artists) {
          showArtist = artists.length > 1;
          rows = [];
          artists.forEach(function (a) {
            a.albums.forEach(function (album) {
              album.artist = a.artist;   // copy the artist name onto each album object
              rows.push(album);
            });
          });
          sortKey = "releaseDate";
          sortAscending = true;
          sortRows();
          renderSummary(artists);
          renderTable();
        })
        .catch(function (err) {
          document.getElementById("summary").innerHTML = '<span class="error">' + err.message + "</span>";
          document.getElementById("tableBody").innerHTML = "";
          document.getElementById("tableFoot").innerHTML = "";
        });
    }

    function renderSummary(artists) {
      const parts = artists.map(function (a) {
        const numberOnes = a.albums.filter(function (x) { return x.billboard200Peak === 1; }).length;
        return a.artist + " (" + a.fullName + ", from " + a.hometown + ") has released <strong>" +
          a.albums.length + "</strong> solo studio albums since " + a.soloDebutYear +
          ", and <strong>" + numberOnes + "</strong> of them reached No. 1 on the Billboard 200.";
      });
      document.getElementById("summary").innerHTML = parts.join("<br>");
    }

    function visibleColumns() {
      return COLUMNS.filter(function (c) { return showArtist || c.key !== "artist"; });
    }

    function formatDate(isoDate) {
      const d = new Date(isoDate + "T00:00:00");
      return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }

    function renderTable() {
      const cols = visibleColumns();

      // Header row
      const header = document.getElementById("headerRow");
      header.innerHTML = "";
      cols.forEach(function (c) {
        const th = document.createElement("th");
        const arrow = (c.key === sortKey) ? (sortAscending ? " ▲" : " ▼") : "";
        th.textContent = c.heading + arrow;
        th.addEventListener("click", function () {
          sortAscending = (sortKey === c.key) ? !sortAscending : true;
          sortKey = c.key;
          sortRows();
          renderTable();
        });
        header.appendChild(th);
      });

      // Body rows
      const body = document.getElementById("tableBody");
      body.innerHTML = "";
      rows.forEach(function (album) {
        const tr = document.createElement("tr");
        cols.forEach(function (c) {
          const td = document.createElement("td");
          let value = album[c.key];
          if (c.key === "releaseDate") value = formatDate(value);
          if (c.key === "billboard200Peak") {
            value = "No. " + value;
            if (album.billboard200Peak === 1) td.className = "number-one";
          }
          if (value === null) value = "—";
          td.textContent = value;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });

      // Totals calculated from the JSON data
      const numberOnes = rows.filter(function (a) { return a.billboard200Peak === 1; }).length;
      const grammyAlbums = rows.filter(function (a) { return a.albumGrammy !== null; }).length;
      document.getElementById("tableFoot").innerHTML =
        '<tr><td colspan="' + cols.length + '">Totals from the JSON data: ' + rows.length +
        " albums, " + numberOnes + " reached No. 1, " + grammyAlbums + " won a Grammy for the album</td></tr>";
    }

    function sortRows() {
      rows.sort(function (a, b) {
        let x = a[sortKey], y = b[sortKey];
        if (x === null) x = "";
        if (y === null) y = "";
        if (typeof x === "string") x = x.toLowerCase();
        if (typeof y === "string") y = y.toLowerCase();
        if (x < y) return sortAscending ? -1 : 1;
        if (x > y) return sortAscending ? 1 : -1;
        return 0;
      });
    }

    const select = document.getElementById("dataSelect");
    select.addEventListener("change", function () { showSelection(select.value); });
    showSelection(select.value);
  </script>
</body>
</html>
