<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 6 - JSON</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f8;
      color: #222;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    h1 { margin-top: 0; }
    .summary { margin-bottom: 16px; line-height: 1.5; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #1f3b5a;
      color: #fff;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { background: #2c5480; }
    tbody tr:nth-child(even) { background: #f7f9fb; }
    tfoot td { font-weight: bold; border-top: 2px solid #1f3b5a; }
    .lost { color: #a12622; font-weight: bold; }
    .retired { color: #1d6b35; font-weight: bold; }
    .error { color: #a12622; font-weight: bold; }
    .note { font-size: 0.85rem; color: #555; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1 id="pageTitle">Loading data...</h1>
    <div class="summary" id="summary"></div>

    <div class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th data-key="name">Orbiter</th>
            <th data-key="designation">Designation</th>
            <th data-key="firstMission">First Mission</th>
            <th data-key="firstFlightYear">First Flight</th>
            <th data-key="finalMission">Final Mission</th>
            <th data-key="finalFlightYear">Final Flight</th>
            <th data-key="missionsFlown">Missions</th>
            <th data-key="status">Status</th>
            <th data-key="location">Where It Is Now</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>

    <p class="note">Click any column heading to sort. All data on this page is read from the external file
      <a href="shuttles.json">shuttles.json</a>, so updating that file updates the page with no HTML changes.</p>
  </main>

  <script>
    // Name of the external JSON file. Change this to display a different data file.
    const DATA_FILE = "shuttles.json";

    let orbiters = [];
    let sortKey = null;
    let sortAscending = true;

    // Read the external JSON file and parse it into a JavaScript object
    fetch(DATA_FILE)
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Could not load " + DATA_FILE + " (HTTP " + response.status + ")");
        }
        return response.text();
      })
      .then(function (text) {
        const data = JSON.parse(text);   // convert JSON text into a JavaScript object
        showPage(data);
      })
      .catch(function (err) {
        document.getElementById("pageTitle").textContent = "Error";
        document.getElementById("summary").innerHTML =
          '<span class="error">' + err.message + "</span>";
      });

    function showPage(data) {
      document.title = data.title;
      document.getElementById("pageTitle").textContent = data.title;
      document.getElementById("summary").innerHTML =
        "The " + data.program.name + " flew <strong>" + data.program.totalMissions +
        "</strong> missions from " + data.program.firstLaunch + " to " + data.program.lastLaunch +
        ", all launched from " + data.launchSite + ". Five orbiters flew in space.";

      orbiters = data.orbiters;
      renderTable();
      renderTotals();
    }

    function renderTable() {
      const body = document.getElementById("tableBody");
      body.innerHTML = "";

      orbiters.forEach(function (o) {
        const row = document.createElement("tr");
        const statusClass = o.status === "Lost" ? "lost" : "retired";

        row.innerHTML =
          "<td>" + o.name + "</td>" +
          "<td>" + o.designation + "</td>" +
          "<td>" + o.firstMission + "</td>" +
          "<td>" + o.firstFlightYear + "</td>" +
          "<td>" + o.finalMission + "</td>" +
          "<td>" + o.finalFlightYear + "</td>" +
          "<td>" + o.missionsFlown + "</td>" +
          '<td class="' + statusClass + '">' + o.status + "</td>" +
          "<td>" + (o.location === null ? "N/A" : o.location) + "</td>";

        body.appendChild(row);
      });
    }

    function renderTotals() {
      const total = orbiters.reduce(function (sum, o) { return sum + o.missionsFlown; }, 0);
      document.getElementById("tableFoot").innerHTML =
        '<tr><td colspan="6">Total missions (calculated from the JSON data)</td>' +
        "<td>" + total + '</td><td colspan="2"></td></tr>';
    }

    // Sort the table when a column heading is clicked
    document.querySelectorAll("th").forEach(function (th) {
      th.addEventListener("click", function () {
        const key = th.getAttribute("data-key");
        sortAscending = (sortKey === key) ? !sortAscending : true;
        sortKey = key;

        orbiters.sort(function (a, b) {
          let x = a[key], y = b[key];
          if (x === null) x = "";
          if (y === null) y = "";
          if (x < y) return sortAscending ? -1 : 1;
          if (x > y) return sortAscending ? 1 : -1;
          return 0;
        });
        renderTable();
      });
    });
  </script>
</body>
</html>
